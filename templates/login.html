{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card border-0 shadow-sm" style="border-radius: var(--radius-lg); overflow: hidden;">
            <div class="card-header bg-white border-0 text-center pt-4 pb-0">
                <div class="navbar-brand-icon mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.4rem;">
                    <i class="bi bi-box-arrow-in-right"></i>
                </div>
                <h4 class="fw-bold mb-1">로그인</h4>
                <p class="text-muted small">맞춤형 검색 조건을 저장하고 관리하세요</p>
            </div>
            <div class="card-body p-4 pt-2">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">아이디</label>
                        <input type="text" class="form-control" name="username" placeholder="아이디 입력" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-muted">비밀번호</label>
                        <input type="password" class="form-control" name="password" placeholder="비밀번호 입력" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold">로그인</button>
                </form>
                <div class="text-center mt-3 small text-muted">
                    계정이 없으신가요? <a href="{{ url_for('register') }}" class="text-primary fw-semibold">회원가입</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
